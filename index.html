<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="google-adsense-account" content="ca-pub-2017155922423033" />

    <!-- Theme: apply dark class before paint to avoid flash -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    </script>

    <!-- SW recovery: only runs once per crash, never loops.
         Uses a localStorage timestamp instead of a flag so we can
         detect if the last reload also crashed (within 10 seconds = loop). -->
    <script>
      try {
        if ("serviceWorker" in navigator) {
          var lastRecovery = localStorage.getItem("warren-last-recovery");
          var now = Date.now();
          var tenSeconds = 10 * 1000;
          var recovering = lastRecovery && (now - parseInt(lastRecovery)) < tenSeconds;

          if (!recovering) {
            // Not in a recovery loop — check if we should recover
            var crashFlag = localStorage.getItem("warren-crash-flag");
            if (crashFlag === "1") {
              // Previous load crashed before App mounted — run recovery
              localStorage.setItem("warren-last-recovery", String(now));
              localStorage.removeItem("warren-crash-flag");

              navigator.serviceWorker.getRegistrations()
                .then(function(regs) {
                  return Promise.all(regs.map(function(r) { return r.unregister(); }));
                })
                .then(function() { return caches.keys(); })
                .then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                })
                .then(function() { window.location.reload(); });
            } else {
              // Fresh load — set crash flag, cleared in App.tsx on success
              localStorage.setItem("warren-crash-flag", "1");
            }
          }
          // If recovering = true, we're in a loop — do nothing, let app load normally
        }
      } catch (_) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Warren | Campus Social Network</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
