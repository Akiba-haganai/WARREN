    <!-- Theme & Accessibility: apply classes before paint to prevent FOUC / layout shift -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
        var fs = localStorage.getItem("fontSize");
        if (fs && fs !== "normal") {
          document.documentElement.classList.add("text-" + fs);
        }
        if (localStorage.getItem("highContrast") === "true") {
          document.documentElement.classList.add("high-contrast");
        }
      } catch (_) {}
    </script>

    <!-- Safe SW crash recovery: only fires after a real chunk-load failure was recorded -->
    <script>
      try {
        if ("serviceWorker" in navigator) {
          // If main.tsx recorded strikes >= 2, we did a nuclear reset already.
          // This block handles the edge case where the page crashes before
          // main.tsx even loads (SW served a bad index.html from cache).
          var needsReset = sessionStorage.getItem("515-sw-hard-reset") === "1";
          if (needsReset) {
            sessionStorage.removeItem("515-sw-hard-reset");
            navigator.serviceWorker.getRegistrations()
              .then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              })
              .then(function() { return caches.keys(); })
              .then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              })
              .then(function() { window.location.reload(); });
          }
        }
      } catch (_) {}
    </script>
